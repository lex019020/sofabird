name: Release

# Every merge into main -> test build (pre-release v<VERSION>-beta.<N>) with the PR's release notes.
# Manual run (channel=stable) -> release v<VERSION> with the notes of all PRs since the previous release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable - release v<VERSION>; beta - one more test build'
        type: choice
        options: [stable, beta]
        default: stable

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      suffix: ${{ steps.v.outputs.suffix }}
      tag: ${{ steps.v.outputs.tag }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          channel=${INPUT_CHANNEL:-beta}
          if [ "$channel" = "stable" ]; then
            suffix=""; version="$base"
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "::error::Release v$version already exists. Bump VERSION in a PR (see CLAUDE.md) and retry."
              exit 1
            fi
          else
            suffix="beta.${GITHUB_RUN_NUMBER}"; version="$base-$suffix"
          fi
          code=$(( $(git rev-list --count HEAD) * 10 ))  # local builds use main*10+5 (deploy-lib.ps1)
          {
            echo "channel=$channel"; echo "version=$version"; echo "suffix=$suffix"
            echo "tag=v$version"; echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "### $channel: v$version (versionCode $code)" >> "$GITHUB_STEP_SUMMARY"

  companion:
    name: Companion
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test
        run: dotnet test companion/VlcRemote.sln -c Release
      - name: Publish and pack (Velopack)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          dotnet tool restore
          # The previous package of the same kind lets vpk build a small delta update next to the full one.
          $download = @('vpk', 'download', 'github', '--repoUrl', "https://github.com/$env:GITHUB_REPOSITORY", '--token', $env:GH_TOKEN, '-o', 'releases')
          if ($env:CHANNEL -ne 'stable') { $download += '--pre' }
          dotnet @download
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous Velopack release: full package only'; $global:LASTEXITCODE = 0 }
          . ./scripts/deploy-lib.ps1
          $null = New-CompanionPackage (Get-Location).Path $env:VERSION '${{ needs.meta.outputs.suffix }}' (Join-Path (Get-Location) 'releases')
          # This release's files only (the downloaded previous package is already on its own release); the update feed
          # needs releases.win.json and the packages. The installer gets a name that sorts next to the APK.
          New-Item -ItemType Directory dist | Out-Null
          Get-ChildItem releases | Where-Object { $_.Name -like "*-$env:VERSION-*.nupkg" -or $_.Name -eq 'releases.win.json' } |
            Copy-Item -Destination dist
          Copy-Item releases/VlcRemoteCompanion-win-Setup.exe dist/VlcRemote-Companion-Setup.exe
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: companion
          path: dist/*

  android:
    name: Android
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing (see CLAUDE.md, "APK signing")"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vlcremote.jks"
          echo "VLCR_KEYSTORE_FILE=$RUNNER_TEMP/vlcremote.jks" >> "$GITHUB_ENV"
      - name: Test and assemble
        env:
          VLCR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VLCR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VLCR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ needs.meta.outputs.code }}
          VERSION_SUFFIX: ${{ needs.meta.outputs.suffix }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew test :app:assembleRelease --no-daemon \
            "-Pvlcr.versionCode=$VERSION_CODE" "-Pvlcr.versionSuffix=$VERSION_SUFFIX"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "../VlcRemote-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: VlcRemote-*.apk

  publish:
    name: Publish
    needs: [meta, companion, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          CHANNEL: ${{ needs.meta.outputs.channel }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if [ "$CHANNEL" = "stable" ]; then
            prev=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
            python3 scripts/release_notes.py stable ${prev:+--since-tag "$prev"} > notes.md
          else
            python3 scripts/release_notes.py beta --sha "$GITHUB_SHA" > notes.md
          fi
          python3 - <<'PY' >> notes.md
          import os
          tag, repo, version = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"], os.environ["VERSION"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          print(rf"""
          ---
          ### Download
          - **PC (Windows 10/11):** [VlcRemote-Companion-Setup.exe]({base}/VlcRemote-Companion-Setup.exe) — run it; it installs
            for the current user and then updates itself (a PC without the .NET 9 runtime gets it, with one administrator prompt).
          - **Phone (Android 8+):** [VlcRemote-{version}.apk]({base}/VlcRemote-{version}.apk)

          **Scripts** (no GitHub account needed; the phone needs adb):
          ```powershell
          $d = "$env:TEMP\vlcremote"; New-Item -ItemType Directory -Force $d | Out-Null
          'deploy-lib.ps1', 'deploy-windows.ps1', 'deploy-android.ps1' | ForEach-Object {{
              Invoke-WebRequest "https://github.com/{repo}/releases/download/{tag}/$_" -OutFile "$d\$_" -UseBasicParsing }}
          & $d\deploy-windows.ps1 -Tag {tag}    # companion on the Windows PC
          & $d\deploy-android.ps1 -Tag {tag}    # app on allowed phones via adb
          ```
          Or download the `deploy-*` files from this release and double-click `deploy-windows.cmd` / `deploy-android.cmd`.""".replace("\n          ", "\n"))
          PY
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cp scripts/deploy-lib.ps1 scripts/deploy-windows.ps1 scripts/deploy-windows.cmd scripts/deploy-android.ps1 scripts/deploy-android.cmd dist/
          if [ "$CHANNEL" = "stable" ]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "VLC Remote $VERSION" --notes-file notes.md --latest
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$VERSION (test build)" --notes-file notes.md --prerelease
          fi
