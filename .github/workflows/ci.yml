name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  companion:
    name: Companion (.NET, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore companion/VlcRemote.sln
      - name: Build
        run: dotnet build companion/VlcRemote.sln -c Release --no-restore
      - name: Test
        run: dotnet test companion/VlcRemote.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Publish (single file, framework-dependent)
        run: dotnet publish companion/VlcRemote.Companion/VlcRemote.Companion.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o artifacts/companion
      - uses: actions/upload-artifact@v4
        with:
          name: companion-win-x64
          path: artifacts/companion

  android:
    name: Android (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
