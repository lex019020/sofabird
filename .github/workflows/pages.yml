name: Website

# The landing page (site/) with the screenshots (docs/images/) and llms.txt, published to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', 'llms.txt', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir -p public/images
          cp -r site/* public/
          cp docs/images/*.png public/images/
          cp llms.txt public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
